[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-agent"
version = "0.1.0"
description = "Strands Agent for LLM-powered code analysis using Bedrock"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=1.0.0",
    "boto3>=1.34.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
code-review = "code_review_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
