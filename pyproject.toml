[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-agent"
version = "0.1.0"
description = "AI-powered code review agent using Strands SDK"
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=0.1.0",
    "boto3>=1.34.0",
    "bandit>=1.7.0",
    "ruff>=0.1.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
]
